name: plantes

services:
  app:
    image: ghcr.io/danielbrendel/hortusfox-web:latest
    container_name: plantes-app
    restart: unless-stopped
    environment:
      APP_ADMIN_EMAIL: "${APP_ADMIN_EMAIL}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD}"
      APP_WORKSPACE: "${APP_WORKSPACE}"
      APP_LANG: "${APP_LANG}"
      APP_TIMEZONE: "${APP_TIMEZONE}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_OVERDUE_TASK_HOURS: "${APP_OVERDUE_TASK_HOURS}"
      APP_CRON_PW: "${APP_CRON_PW}"
      # "db" est ambigu : nufflearena_db porte cet alias sur traefik-network partagé
      DB_HOST: plantes-db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_CHARSET: "utf8mb4"
      SMTP_AUTH: "${SMTP_AUTH}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_ENCRYPTION: "${SMTP_ENCRYPTION}"
      SMTP_FROMNAME: "${SMTP_FROMNAME}"
      SMTP_FROMADDRESS: "${SMTP_FROMADDRESS}"
    volumes:
      - app_images:/var/www/html/public/img
      - app_attachments:/var/www/html/public/attachments
      - app_logs:/var/www/html/app/logs
      - app_backup:/var/www/html/public/backup
      - app_themes:/var/www/html/public/themes
      - app_migrate:/var/www/html/app/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK}"
      # NB: Compose n'interpole pas les variables dans les clés YAML — noms en dur
      traefik.http.routers.plantes.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.plantes.entrypoints: "${TRAEFIK_ENTRYPOINT}"
      traefik.http.routers.plantes.tls: "true"
      traefik.http.routers.plantes.tls.certresolver: "${TRAEFIK_CERTRESOLVER}"
      traefik.http.routers.plantes.middlewares: "plantes-headers"
      traefik.http.services.plantes.loadbalancer.server.port: "80"
      traefik.http.middlewares.plantes-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.plantes-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.plantes-headers.headers.referrerPolicy: "same-origin"

  db:
    image: mariadb:11.4
    container_name: plantes-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  internal:
    internal: true
    # Pools d'adresses par défaut épuisés sur cet hôte (34 réseaux) — subnet explicite
    ipam:
      config:
        - subnet: 10.90.0.0/24
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK}"

volumes:
  db_data:
  app_images:
  app_attachments:
  app_logs:
  app_backup:
  app_themes:
  app_migrate:
